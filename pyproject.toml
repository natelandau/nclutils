[project]
    authors = [{ name = "Nathaniel Landau", email = "github@natenate.org" }]
    classifiers = [
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
    ]
    dependencies = ["questionary>=2.1.1, <3.0.0", "rich>=15.0.0, <16.0.0"]
    description = "Collection of convenience functions used in Python packages and scripts."
    license = "MIT"
    license-files = ["LICENSE"]
    name = "nclutils"
    readme = "README.md"
    requires-python = ">=3.10"
    version = "3.4.1"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.11.0,<0.12.0"]

[dependency-groups]
    dev = [
        "commitizen>=4.15.1",
        "coverage>=7.14.0",
        "duty>=1.9.0",
        "freezegun>=1.5.5",
        "prek>=0.3.13",
        "pytest-clarity>=1.0.1",
        "pytest-cov>=7.1.0",
        "pytest-devtools>=1.2.0",
        "pytest-env>=1.6.0",
        "pytest-mock>=3.15.1",
        "pytest-pretty-terminal>=1.1.0",
        "pytest-sugar>=1.1.1",
        "pytest>=9.0.3",
        "ruff>=0.15.12",
        "ty>=0.0.35",
        "typos>=1.46.1",
        "xdoctest>=1.3.2",
    ]

[tool.commitizen]
    bump_message               = "bump(release): v$current_version → v$new_version"
    changelog_merge_prerelease = true
    tag_format                 = "v$version"
    update_changelog_on_bump   = true
    version_provider           = "uv"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
    exclude_lines = [
        '@overload',
        'assert_never',
        'def __repr__',
        'except [\w\s\._]+ as .*:',
        'if TYPE_CHECKING:',
        'if __name__ == .__main__.:',
        'pragma: no cover',
    ]
    # fail_under = 50
    precision    = 1
    show_missing = true
    skip_covered = true

[tool.coverage.run]
    branch       = true
    command_line = "--module pytest"
    data_file    = ".cache/.coverage"
    source       = ["src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.pytest.ini_options]
    addopts        = "--color=yes --xdoctest --exitfirst --failed-first --strict-config --strict-markers --junitxml=.cache/pytest.xml"
    cache_dir      = ".cache/pytest"
    filterwarnings = ["error", "ignore::DeprecationWarning"]
    testpaths      = ["src", "tests"]
    xfail_strict   = true

[tool.ruff] # https://github.com/charliermarsh/ruff
    exclude        = [".venv/", "tmp/"]
    fix            = true
    line-length    = 100
    output-format  = "grouped"
    src            = ["src", "tests"]
    target-version = "py310"

    [tool.ruff.lint]
        ignore = [
            "ANN204", # missing return type annotation for special method `__init__`
            "B006",   # mutable-argument-default
            "B008",   # function-call-in-default-argument
            "COM812", # Trailing comma missing"
            "CPY001", # Missing copyright notice at top of file
            "D107",   # undocumented-public-init
            "D213",   # multi-line-summary-second-line
            "E501",   # line-too-long
            "FIX002", # Line contains TODO, consider resolving the issue
            "TD002",  # Missing author in TODO
            "TD003",  # Missing issue link on the line following this TODO
            "UP007",  # non-pep604-annotation
        ]
        per-file-ignores = { "tests/*.py" = [
            "A002",
            "A003",
            "ANN001",
            "ANN201",
            "ARG001",
            "ARG002",
            "ARG005",
            "D102",
            "ERA001",
            "F403",
            "FBT001",
            "FBT002",
            "PGH003",
            "PLR0913",
            "PLR0917",
            "PLR2004",
            "PLR6301",
            "S101",
            "S603",  # subprocess call with untrusted input (argv is built from literals in tests)
            "S607",  # starting process with partial path (relying on PATH for git is intentional in tests)
            "SLF001",  # Access a private attribute
            "PT012",  # pytest.raises block multiple statements (legit when state must be set on a yielded object before raising)
            "TRY301",  # Abstract `raise` to an inner function (tests intentionally raise inline to exercise real call sites)
        ], "duties.py" = ["ANN001", "FBT001", "FBT002"], "src/nclutils/pp/emitter.py" = [
            "ANN401", # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
        ] }
        select = ["ALL"]
        unfixable = [
            "ERA001", # Commented out code
            "F401",   # unused-import
            "F841",   # unused-variable
        ]
        [tool.ruff.lint.mccabe]
            # Unlike Flake8, default to a complexity level of 10.
            max-complexity = 10

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-args = 6

    [tool.ruff.format]
        indent-style              = "space"
        line-ending               = "auto"
        quote-style               = "double"
        skip-magic-trailing-comma = false

[tool.ty.terminal]
    error-on-warning = true
